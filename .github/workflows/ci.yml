name: Portfolio CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check HTML File
        run: test -f portfolio-website/index.html

      - name: Display Success Message
        run: echo "Portfolio website CI completed successfully"